[database]
host = mariadb-main
user = appuser
password = CHANGE_ME_APP_PASSWORD
db = crawler_sentiment_analysis
charset = utf8

[queries]
; %%s -> %s 로 변경
model_data_query = SELECT a.id, a.keyword_id, a.title, LEFT(a.content, 200), a.url, r.sentiment, r.score, a.published_at, a.collected_at FROM crawler_article_list a JOIN sentiment_results r ON a.id = r.article_id WHERE r.model_name = %s ORDER BY a.id DESC LIMIT 1000

; %%s -> %s 로 변경 (두 군데 모두)
model_comparison_query = SELECT a.id, a.keyword_id, a.title, LEFT(a.content, 100), a.url, a.published_at, r1.sentiment, r1.score, r2.sentiment, r2.score FROM crawler_article_list a JOIN sentiment_results r1 ON a.id = r1.article_id AND r1.model_name = %s JOIN sentiment_results r2 ON a.id = r2.article_id AND r2.model_name = %s ORDER BY a.id DESC LIMIT 500

[models]
; URL 슬러그 = 실제 DB에 저장된 모델명
kobert = KoBERT-Senti5
koelectra = KoELECTRA
qwen3-4b-AWQ = qwen3:4b-AWQ
qwen3-4b-instruct = qwen3:4b-instruct

[sentiments]
; 모델별 감정 목록 (콤마로 구분)
kobert = positive, negative, neutral
koelectra = angry, happy, anxious, embarrassed, sad, heartache
qwen3-4b-AWQ = angry, happy, anxious, embarrassed, sad, heartache, fear, tender
qwen3-4b-instruct = angry, happy, anxious, embarrassed, sad, heartache, fear, tender


[emojis]
; 감정별 이모지 매핑 (공통)
angry = 😠
fear = 😳
happy = 😊
positive = 😊
tender = 😐
negative = 😢
sad = 😢
anxious = 😰
embarrassed = 😳
heartache = 💔
neutral = 😐
